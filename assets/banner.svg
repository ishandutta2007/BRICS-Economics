<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2a6c" />
      <stop offset="50%" stop-color="#b21f1f" />
      <stop offset="100%" stop-color="#fdbb2d" />
      <animate attributeName="x1" values="0%;100%;0%" dur="15s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;0%;100%" dur="15s" repeatCount="indefinite" />
      <animate attributeName="y1" values="0%;100%;0%" dur="10s" repeatCount="indefinite" />
      <animate attributeName="y2" values="100%;0%;100%" dur="10s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" rx="15" />
  <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#ffffff" filter="drop-shadow(2px 4px 6px rgba(0,0,0,0.5))">
    BRICS Economics
  </text>
  <text x="50%" y="70%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#eeeeee">
    Projecting the Future to 2050
  </text>
  <circle cx="10%" cy="50%" r="5" fill="#fff">
    <animate attributeName="r" values="5;10;5" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="90%" cy="50%" r="5" fill="#fff">
    <animate attributeName="r" values="5;10;5" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite" />
  </circle>
</svg>
